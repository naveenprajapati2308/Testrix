services:
  genai-service:
    build:
      context: ./service
      dockerfile: Dockerfile
    container_name: testrix-genai
    restart: unless-stopped
    # Groq/Tavily API keys live in service/.env (gitignored, never committed).
    env_file:
      - ./service/.env
    environment:
      PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET:?PORTAL_JWT_SECRET must be set in .env}
      # Internal-only URLs on the shared testrix_network — the AI Assistant's tools call
      # these directly, forwarding the caller's own JWT (never a service credential).
      AUTOMATION_BASE_URL: http://automation-portal-backend:8080
      API_TESTING_BASE_URL: http://api-testing-backend:8080
      PERFORMANCE_BASE_URL: http://performance-testing-backend:8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "3000:3000"
    networks:
      - testrix

networks:
  testrix:
    name: testrix_network
