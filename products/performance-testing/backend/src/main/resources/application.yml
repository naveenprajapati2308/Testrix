spring:
  application:
    name: performance-testing-backend

  autoconfigure:
    # Auth here is entirely JWT-based (JwtValidationFilter) — no HTTP Basic is registered,
    # so Spring Boot's auto-created in-memory user is unreachable dead weight. Excluding it
    # only silences the "Using generated security password" boot-log noise.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/testrix_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none        # Flyway manages ALL schema changes
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # testrix_platform already has other products' tables in it, so Flyway sees a "non-empty
    # schema" and refuses to run without a baseline. baseline-version 0 (below this product's
    # own V1) means the baseline represents "nothing of mine exists yet" — V1 through V3 all
    # still run in full, unlike API Testing's baseline (version 1) which intentionally treats
    # its own V1 as already-applied because it was backfilling real legacy Hibernate tables.
    baseline-on-migrate: true
    baseline-version: 0
    # This backend shares the testrix_platform schema with every other Testrix product —
    # each product's Flyway history must live in its own table (same fix API Testing uses:
    # flyway_schema_history_apitest) or migration histories collide.
    table: flyway_schema_history_perf

server:
  port: 8080

# k6 configuration
perf:
  k6:
    output-dir: ${K6_OUTPUT_DIR:/app/k6-runs}
    binary-path: k6       # k6 must be on PATH in Docker image
  scheduler:
    poll-interval-ms: 30000   # how often scheduler thread wakes up
    timezone: ${SCHEDULER_TZ:Asia/Kolkata}
    # Round-robin the claim batch across projects so one project with a huge backlog
    # can't fill every batch and starve the rest. No effect on a single-project setup.
    fair-claim-enabled: ${PERF_SCHEDULER_FAIR_CLAIM:true}
    claim-batch-size: ${PERF_SCHEDULER_CLAIM_BATCH_SIZE:20}
    claim-candidate-multiplier: ${PERF_SCHEDULER_CLAIM_CANDIDATE_MULTIPLIER:5}
    # Spread schedules sharing a cron boundary over this many seconds. 0 = off, keeping
    # today's exact firing times.
    jitter-seconds: ${PERF_SCHEDULER_JITTER_SECONDS:0}
    # Hard cap on schedules per project (paused ones counted too). 0 disables the cap.
    max-schedules-per-project: ${PERF_SCHEDULER_MAX_SCHEDULES_PER_PROJECT:100}
  queue:
    poll-interval-ms: 5000                            # PerfJobWorker drain frequency (ms)
    max-concurrent-runs: ${PERF_QUEUE_MAX_CONCURRENT:3}  # hard cap on simultaneous k6 processes
    job-timeout-minutes: ${PERF_QUEUE_JOB_TIMEOUT:60}   # wall-clock minutes before force-fail
  drift:
    window-days: 30           # rolling average window
    warning-threshold-pct: 10  # drift > 10% = WARNING
    critical-threshold-pct: 25 # drift > 25% = CRITICAL

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    # Same signing secret automation-portal issues login tokens with — this service only
    # validates signature + expiry, it never issues its own tokens. No insecure fallback;
    # startup fails if unset.
    secret: ${PORTAL_JWT_SECRET}

cors:
  # Comma-separated browser origins allowed to call this API directly, bypassing the gateway —
  # same pattern as automation-portal's SecurityConfig. Left blank on purpose (see that file's
  # application.yml comment) — the real default list lives in corsConfigurationSource() below.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
