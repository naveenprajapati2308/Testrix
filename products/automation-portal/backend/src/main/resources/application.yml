server:
  port: 8080

spring:
  application:
    name: automation-portal-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: jdbc:mysql://localhost:3306/testrix_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    resources:
      static-locations: "classpath:/static/,file:artifacts/"
portal:
  events:
    # No insecure fallback on purpose — the webhook signature check is worthless if every
    # deployment silently accepts the same well-known default. Startup fails if unset.
    api-key: ${PORTAL_EVENTS_API_KEY}
  execution-manager:
    url: ${PORTAL_EXECUTION_MANAGER_URL:http://localhost:8090}
  artifact-service:
    url: ${PORTAL_ARTIFACT_SERVICE_URL:http://localhost:9091}
  jwt:
    # Verification only — this service issues no tokens. Must be the same secret the platform
    # service signs with. No insecure fallback on purpose: see events.api-key above.
    secret: ${PORTAL_JWT_SECRET}
  automation:
    repository-path: ${PORTAL_AUTOMATION_REPOSITORY_PATH:D:/New folder/MPHIDB}
    playwright-path: ${PORTAL_AUTOMATION_PLAYWRIGHT_PATH:D:/playwright-js}
    maven-command: "mvn test -DsuiteXmlFile={suiteXml} -DopenReport=false"
    artifacts-root: "artifacts"
    suites:
      all:
        name: "Master Automation Suite"
        xml: "MPHIDB-v2.xml"
        report: "reports/Master_Automation_Suite.html"
      land:
        name: "Land Management Suite"
        xml: "land-v2.xml"
        report: "reports/Land_Management_Suite.html"
      architect:
        name: "Architect Empanelment Suite"
        xml: "Emp_Arch-v2.xml"
        report: "reports/Architect_Empanelment_Suite.html"
      arch_workflow:
        name: "Architect Workflow Suite"
        xml: "Arch_workflow-v2.xml"
        report: "reports/Architect_workflow_Suite.html"
    result-files:
      # Maven Surefire's TestNG provider writes TestNG's native reports under
      # target/surefire-reports (not test-output) once -Dusedefaultlisteners=true is set.
      testng-results: "target/surefire-reports/testng-results.xml"
      testng-failed: "target/surefire-reports/testng-failed.xml"
      emailable-report: "target/surefire-reports/emailable-report.html"
      index-report: "target/surefire-reports/index.html"
      screenshots: "screenShots"
      logs: "logs"
  uploads:
    guide-images-dir: ${PORTAL_GUIDE_IMAGES_DIR:${PORTAL_AUTOMATION_ARTIFACTS_ROOT:artifacts}/guide-images}

cors:
  # Only matters for direct-port access — the gateway serves every frontend and API same-origin.
  # Left blank on purpose: Spring's ${X:default} does not cover the empty string Compose passes,
  # so the real default list lives in SecurityConfig.corsConfigurationSource().
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

logging:
  level:
    com.automationportal: INFO
