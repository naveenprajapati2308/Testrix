server:
  port: 8080

spring:
  application:
    name: automation-portal-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: jdbc:mysql://localhost:3306/testrix_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  web:
    resources:
      static-locations: "classpath:/static/,file:artifacts/"
portal:
  events:
    # No insecure fallback on purpose — the webhook signature check is worthless if every
    # deployment silently accepts the same well-known default. Startup fails if unset.
    api-key: ${PORTAL_EVENTS_API_KEY}
  execution-manager:
    url: ${PORTAL_EXECUTION_MANAGER_URL:http://localhost:8090}
  artifact-service:
    url: ${PORTAL_ARTIFACT_SERVICE_URL:http://localhost:9091}
  jwt:
    # No insecure fallback on purpose — see events.api-key above. Startup fails if unset.
    secret: ${PORTAL_JWT_SECRET}
    expiration-minutes: ${PORTAL_JWT_EXPIRATION_MINUTES:30}
    refresh-expiration-days: ${PORTAL_JWT_REFRESH_EXPIRATION_DAYS:14}
  automation:
    repository-path: ${PORTAL_AUTOMATION_REPOSITORY_PATH:D:/New folder/MPHIDB}
    playwright-path: ${PORTAL_AUTOMATION_PLAYWRIGHT_PATH:D:/playwright-js}
    maven-command: "mvn test -DsuiteXmlFile={suiteXml} -DopenReport=false"
    artifacts-root: "artifacts"
    suites:
      all:
        name: "Master Automation Suite"
        xml: "MPHIDB-v2.xml"
        report: "reports/Master_Automation_Suite.html"
      land:
        name: "Land Management Suite"
        xml: "land-v2.xml"
        report: "reports/Land_Management_Suite.html"
      architect:
        name: "Architect Empanelment Suite"
        xml: "Emp_Arch-v2.xml"
        report: "reports/Architect_Empanelment_Suite.html"
      arch_workflow:
        name: "Architect Workflow Suite"
        xml: "Arch_workflow-v2.xml"
        report: "reports/Architect_workflow_Suite.html"
    result-files:
      # Maven Surefire's TestNG provider writes TestNG's native reports under
      # target/surefire-reports (not test-output) once -Dusedefaultlisteners=true is set.
      testng-results: "target/surefire-reports/testng-results.xml"
      testng-failed: "target/surefire-reports/testng-failed.xml"
      emailable-report: "target/surefire-reports/emailable-report.html"
      index-report: "target/surefire-reports/index.html"
      screenshots: "screenShots"
      logs: "logs"
  app:
    frontend-url: ${PORTAL_FRONTEND_URL:http://localhost:15173}
  mail:
    # Real address stays whatever SMTP account authenticates the send (Gmail/most relays reject
    # a mismatched From) — only the display name below is what recipients actually see.
    from: ${PORTAL_MAIL_FROM:${SMTP_USER:no-reply@testrix.local}}
    from-name: ${PORTAL_MAIL_FROM_NAME:Testrix}
    # Not the only guard: MailService also forces console-only whenever spring.mail.username is
    # blank, so environments with no SMTP_* creds configured never try to send for real.
    console-only: ${PORTAL_MAIL_CONSOLE_ONLY:false}
  uploads:
    profiles-dir: ${PORTAL_PROFILES_DIR:${PORTAL_AUTOMATION_ARTIFACTS_ROOT:artifacts}/profiles}

cors:
  # Comma-separated browser origins allowed to call this API directly, bypassing the gateway.
  # The gateway serves every frontend+API same-origin, so this only matters for direct-port
  # access (dev tools, a future non-gateway client) — add the real production domain here once
  # one exists, e.g. CORS_ALLOWED_ORIGINS=https://testrix.in,http://localhost:15000
  # Left blank (not a hardcoded default here) on purpose — Spring's ${X:default} only falls
  # back when X is entirely unset, not when Compose passes it through as an empty string, so
  # the real default list lives in SecurityConfig.corsConfigurationSource() instead.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  superadmin:
    # Only applied the first time the Super Admin account is created — an existing account's
    # password is never touched on restart, so changing this has no effect on an already-seeded
    # database. No insecure fallback on purpose — see events.api-key above. Startup fails if
    # unset, so a fresh install can never seed the well-known literal "password".
    seed-password: ${PORTAL_SUPERADMIN_SEED_PASSWORD}
    # The one Super Admin identity, platform-wide. No insecure fallback on purpose — see
    # events.api-key above. DataSeeder both seeds and self-heals an existing account's
    # username/email to match this on every boot.
    email: ${PORTAL_SUPERADMIN_EMAIL}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

logging:
  level:
    com.automationportal: INFO
