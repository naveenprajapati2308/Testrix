spring:
  application:
    name: testcase-generator-backend

  autoconfigure:
    # Auth here is entirely JWT-based (JwtValidationFilter) — no HTTP Basic is registered, so
    # Spring Boot's auto-created in-memory user is unreachable dead weight. Excluding it only
    # silences the "Using generated security password" boot-log noise.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/testrix_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none        # Flyway manages ALL schema changes
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # testrix_platform already holds the other products' tables, so Flyway sees a "non-empty
    # schema" and refuses to run without a baseline. baseline-version 0 (below this product's
    # own V1) means "nothing of mine exists yet", so V1 still runs in full.
    baseline-on-migrate: true
    baseline-version: 0
    # This backend shares testrix_platform with every other Testrix product — each product's
    # Flyway history must live in its own table or the migration histories collide.
    table: flyway_schema_history_testgen

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB

server:
  port: 8080

testgen:
  storage:
    # Uploaded SRS bytes. Volume-mounted in Docker and never exposed as a static route — the
    # only way to read one back is the authenticated, ownership-checked download endpoint.
    dir: ${SRS_STORE_DIR:/app/srs-files}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
    # Chunks generated in parallel. Raising this speeds up large documents but burns the
    # per-minute AI quota faster.
    concurrency: ${GEMINI_CONCURRENCY:8}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:120}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    # Same signing secret platform-backend issues login tokens with — this service only
    # validates signature + expiry, it never issues its own. No insecure fallback; startup
    # fails if unset.
    secret: ${PORTAL_JWT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
