<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testrix</title>
</head>
<body style="margin:0;padding:0;background:#f2f5f7;font-family:'Segoe UI',Arial,sans-serif;">
  <span style="display:none;max-height:0;overflow:hidden;opacity:0;">{{preheader}}</span>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f2f5f7;padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;">
          <tr>
            <td style="background:#176b87;padding:20px 32px;">
              <span style="color:#ffffff;font-size:20px;font-weight:700;letter-spacing:0.5px;">Testrix</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;color:#243342;font-size:15px;line-height:1.6;">
              {{content}}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px;background:#f8fafb;border-top:1px solid #e2e8f0;color:#8a97a3;font-size:12px;">
              This is an automated message from Testrix. Please do not reply directly to this email.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
