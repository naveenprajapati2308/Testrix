server:
  port: 8080

spring:
  application:
    name: testrix-platform-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/testrix_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Own history table — testrix_platform is shared, and each product already keeps its own.
    # The identity/mail tables were created by automation-portal's V1-V32 back when auth lived
    # there; that history stays frozen, and future platform changes belong in this stream.
    table: flyway_schema_history_platform
    baseline-on-migrate: true
    baseline-version: 0
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  web:
    resources:
      static-locations: "classpath:/static/,file:artifacts/"

portal:
  events:
    # Shared secret for service-to-service calls (the products' report mail goes through
    # /api/internal/reports/mail). No insecure fallback on purpose — the check is worthless if
    # every deployment silently accepts the same well-known default. Startup fails if unset.
    api-key: ${PORTAL_EVENTS_API_KEY}
  jwt:
    # The signing key for every token the platform issues. Product services verify against this
    # same secret locally, which is what lets them keep serving while this service is down.
    # No insecure fallback on purpose — see events.api-key above.
    secret: ${PORTAL_JWT_SECRET}
    expiration-minutes: ${PORTAL_JWT_EXPIRATION_MINUTES:30}
    refresh-expiration-days: ${PORTAL_JWT_REFRESH_EXPIRATION_DAYS:14}
  app:
    frontend-url: ${PORTAL_FRONTEND_URL:http://localhost:15000}
  mail:
    # Real address stays whatever SMTP account authenticates the send (Gmail/most relays reject
    # a mismatched From) — only the display name below is what recipients actually see.
    from: ${PORTAL_MAIL_FROM:${SMTP_USER:no-reply@testrix.local}}
    from-name: ${PORTAL_MAIL_FROM_NAME:Testrix}
    # Not the only guard: MailService also forces console-only whenever spring.mail.username is
    # blank, so environments with no SMTP_* creds configured never try to send for real.
    console-only: ${PORTAL_MAIL_CONSOLE_ONLY:false}
  uploads:
    root: ${PORTAL_UPLOADS_ROOT:artifacts}
    profiles-dir: ${PORTAL_PROFILES_DIR:${PORTAL_UPLOADS_ROOT:artifacts}/profiles}
  superadmin:
    # Only applied the first time the Super Admin account is created — an existing account's
    # password is never touched on restart. No insecure fallback on purpose, so a fresh install
    # can never seed a well-known literal.
    seed-password: ${PORTAL_SUPERADMIN_SEED_PASSWORD}
    # The one Super Admin identity, platform-wide. DataSeeder both seeds and self-heals an
    # existing account's username/email to match this on every boot.
    email: ${PORTAL_SUPERADMIN_EMAIL}

security:
  # Brute-force guard on the unauthenticated credential endpoints. Nothing is blocked
  # permanently — passing a limit starts a hold that expires on its own. Counted per submitted
  # username AND per client IP, since an IP can be forged but a username cannot.
  # Set a max-attempts to 0 to disable that tier.
  rate-limit:
    enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
    account:
      max-attempts: ${AUTH_RATE_LIMIT_ACCOUNT_ATTEMPTS:20}
      window-seconds: ${AUTH_RATE_LIMIT_ACCOUNT_WINDOW_SECONDS:3600}
      lockout-seconds: ${AUTH_RATE_LIMIT_ACCOUNT_LOCKOUT_SECONDS:3600}
    ip:
      max-attempts: ${AUTH_RATE_LIMIT_IP_ATTEMPTS:40}
      window-seconds: ${AUTH_RATE_LIMIT_IP_WINDOW_SECONDS:3600}
      lockout-seconds: ${AUTH_RATE_LIMIT_IP_LOCKOUT_SECONDS:86400}

cors:
  # Only matters for direct-port access — the gateway serves every frontend and API same-origin.
  # Add the real production domain here once one exists.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

logging:
  level:
    com.testrix.platform: INFO
