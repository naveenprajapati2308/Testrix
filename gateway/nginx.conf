server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    # No HSTS: this gateway is plain HTTP, and HSTS would break local http:// access.
    # frame-ancestors 'self' rather than a stricter default-src, because the shell legitimately
    # iframes every product on this same origin.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # Docker's embedded DNS — re-resolve container IPs so backend restarts
    # don't leave the gateway pointing at dead addresses.
    resolver 127.0.0.11 valid=10s;
    set $platform_backend testrix-platform-backend;
    set $automation_backend automation-portal-backend;
    set $apitest_backend api-testing-backend;
    set $genai_backend testrix-genai;
    set $perf_backend performance-testing-backend;

    # ── Platform: identity and mail, shared by every product ────────────────────
    # The only service the sign-in path touches, so login, profile and user administration
    # stay up no matter which product is down.
    location /platform/api/ {
        rewrite ^/platform(/api/.*)$ $1 break;
        proxy_pass http://$platform_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location /platform/oauth2/ {
        rewrite ^/platform(/oauth2/.*)$ $1 break;
        proxy_pass http://$platform_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Profile pictures are written by the platform service, so they must be read back from it.
    # Longest-prefix match puts this ahead of the /uploads/ rule below.
    location /uploads/profiles/ {
        proxy_pass http://$platform_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Automation ──────────────────────────────────────────────────────────────
    location /automation/api/ {
        rewrite ^/automation(/api/.*)$ $1 break;
        proxy_pass http://$automation_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /automation/uploads/ {
        rewrite ^/automation(/uploads/.*)$ $1 break;
        proxy_pass http://$automation_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Execution reports and screenshots.
    location /uploads/ {
        proxy_pass http://$automation_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /automation/ {
        try_files $uri $uri/ /automation/index.html;
    }

    # ── Products ────────────────────────────────────────────────────────────────
    # No auth_request subrequest on purpose: every product verifies the JWT itself, so a
    # gateway-side check would add only a hard dependency on whichever service answered it —
    # which is how an automation outage used to take down all three other products.
    location /apitest/api/ {
        rewrite ^/apitest(/api/.*)$ $1 break;
        proxy_pass http://$apitest_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /apitest/ {
        try_files $uri $uri/ /apitest/index.html;
    }

    location /perf/api/ {
        rewrite ^/perf(/api/.*)$ $1 break;
        proxy_pass http://$perf_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /perf/ {
        try_files $uri $uri/ /perf/index.html;
    }

    location /genai/ {
        rewrite ^/genai(/.*)$ $1 break;
        proxy_pass http://$genai_backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ── Health ──────────────────────────────────────────────────────────────────
    location = /health/platform {
        rewrite ^ /actuator/health break;
        proxy_pass http://$platform_backend:8080;
    }

    location = /health/automation {
        rewrite ^ /actuator/health break;
        proxy_pass http://$automation_backend:8080;
    }

    location = /health/apitest {
        rewrite ^ /actuator/health break;
        proxy_pass http://$apitest_backend:8080;
    }

    location = /health/genai {
        rewrite ^ / break;
        proxy_pass http://$genai_backend:3000;
    }

    location = /health/perf {
        rewrite ^ /actuator/health break;
        proxy_pass http://$perf_backend:8080;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
